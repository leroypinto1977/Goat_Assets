    <!-- Horns -->
    <path d="M 22 28 C 16 16, 26 8, 32 8 C 30 14, 28 20, 28 26" />
    <path d="M 26 28 C 22 18, 30 10, 36 12 C 34 17, 31 22, 30 27" stroke-width="1.4" opacity="0.85" />
